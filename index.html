<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人记账工作台 v2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f8fa; --card: #fff; --border: #e8eaed;
    --text: #1f2329; --text-2: #646a73; --text-3: #8f959e;
    --primary: #4e83ff; --primary-light: #e8f0ff;
    --success: #00b42a; --success-light: #e8ffea;
    --warning: #ff7d00; --warning-light: #fff7e6;
    --danger: #f53f3f; --danger-light: #fff1f0;
    --income: #00b42a; --expense: #f53f3f;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
  .container { max-width: 1280px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 24px; font-weight: 700; }
  .header h1 span { color: var(--primary); }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: #3a6fe0; color: #fff; }
  .btn-danger { color: var(--danger); border-color: #ffd0d0; }
  .btn-danger:hover { background: var(--danger-light); border-color: var(--danger); }
  .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi { padding: 18px 20px; }
  .kpi-label { font-size: 13px; color: var(--text-3); margin-bottom: 6px; }
  .kpi-value { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .kpi-value.primary { color: var(--primary); }
  .kpi-value.expense { color: var(--expense); }
  .kpi-value.income { color: var(--income); }
  .kpi-value.balance { color: var(--primary); }
  .kpi-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .kpi-sub.up { color: var(--danger); }
  .kpi-sub.down { color: var(--success); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .section-title .hint { font-size: 12px; color: var(--text-3); font-weight: 400; }
  .form-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; }
  .form-item { display: flex; flex-direction: column; gap: 4px; }
  .form-item label { font-size: 12px; color: var(--text-3); }
  .form-item input, .form-item select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.15s; }
  .form-item input:focus, .form-item select:focus { border-color: var(--primary); }
  .table-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 10px 12px; background: #fafbfc; border-bottom: 1px solid var(--border); color: var(--text-2); font-weight: 600; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
  tbody td { padding: 10px 12px; border-bottom: 1px solid #f2f3f5; }
  tbody tr:hover { background: #fafbfc; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
  .amount.expense { color: var(--expense); }
  .amount.income { color: var(--income); }
  .row-actions { display: flex; gap: 6px; }
  .chart-box { position: relative; height: 280px; }
  .filter-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .filter-row select, .filter-row input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .filter-row .search { flex: 1; min-width: 180px; }
  .insight-item { padding: 12px 14px; border-radius: 8px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
  .insight-item:last-child { margin-bottom: 0; }
  .insight-item .icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .insight-item.warn { background: var(--warning-light); border-left: 3px solid var(--warning); }
  .insight-item.danger { background: var(--danger-light); border-left: 3px solid var(--danger); }
  .insight-item.info { background: var(--primary-light); border-left: 3px solid var(--primary); }
  .insight-item.success { background: var(--success-light); border-left: 3px solid var(--success); }
  .insight-item .title { font-weight: 600; margin-bottom: 2px; }
  .insight-item .desc { color: var(--text-2); }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-3); font-size: 14px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 14px; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab:hover { color: var(--primary); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* 收入/支出切换 */
  .type-switch { display: inline-flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .type-switch button { padding: 6px 16px; border: none; background: var(--card); font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .type-switch button.active.expense { background: var(--danger); color: #fff; }
  .type-switch button.active.income { background: var(--success); color: #fff; }

  /* 预算 */
  .budget-item { margin-bottom: 14px; }
  .budget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .budget-cat { font-weight: 600; }
  .budget-amount { color: var(--text-2); }
  .budget-bar { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
  .budget-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .budget-fill.normal { background: var(--success); }
  .budget-fill.warning { background: var(--warning); }
  .budget-fill.over { background: var(--danger); }
  .budget-detail { font-size: 12px; color: var(--text-3); margin-top: 4px; display: flex; justify-content: space-between; }
  .budget-set-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .budget-set-row select, .budget-set-row input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }

  /* 日历 */
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-header { text-align: center; font-size: 12px; color: var(--text-3); padding: 8px 0; font-weight: 600; }
  .cal-day { aspect-ratio: 1; border-radius: 8px; padding: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid transparent; }
  .cal-day:hover { border-color: var(--primary); }
  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day.empty:hover { border-color: transparent; }
  .cal-day.has-expense { background: var(--danger-light); }
  .cal-day.has-income { background: var(--success-light); }
  .cal-day.has-both { background: linear-gradient(135deg, var(--danger-light) 50%, var(--success-light) 50%); }
  .cal-day .day-num { font-weight: 600; }
  .cal-day .day-amt { font-size: 10px; color: var(--text-2); font-weight: 600; }
  .cal-day.today { border: 2px solid var(--primary); }
  .cal-nav { display: flex; align-items: center; gap: 12px; }
  .cal-nav button { padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); cursor: pointer; font-size: 13px; }
  .cal-nav button:hover { border-color: var(--primary); }
  .cal-month-label { font-size: 16px; font-weight: 600; min-width: 100px; text-align: center; }

  /* 回收站 */
  .trash-item { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .trash-item .info { flex: 1; }
  .trash-item .expire { font-size: 11px; color: var(--text-3); }

  /* 导入确认表 */
  .import-table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .import-table th { text-align: left; padding: 8px 10px; background: #fafbfc; border-bottom: 1px solid var(--border); }
  .import-table td { padding: 8px 10px; border-bottom: 1px solid #f2f3f5; }
  .import-table input, .import-table select { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
  .import-table .ambiguous { background: var(--warning-light); }

  /* 模态框 */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border-radius: 12px; padding: 24px; max-width: 800px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  @media (max-width: 900px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: repeat(2, 1fr); }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d8dce0; border-radius: 4px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📒 个人记账<span>工作台</span></h1>
    <div class="header-actions">
      <button class="btn" onclick="showSyncModal()" id="syncBtn">☁️ 云端同步</button>
      <button class="btn" onclick="showImportModal()">⬆️ 批量导入</button>
      <button class="btn" onclick="exportJSON()">⬇️ 导出数据</button>
      <label class="btn" style="margin:0;">📂 导入JSON
        <input type="file" accept=".json" onchange="importJSON(event)" style="display:none;">
      </label>
      <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空</button>
    </div>
  </div>

  <!-- KPI -->
  <div class="kpi-row" id="kpiRow"></div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('dashboard')">📊 总览</div>
    <div class="tab" onclick="switchTab('budget')">💰 预算</div>
    <div class="tab" onclick="switchTab('calendar')">📅 日历</div>
    <div class="tab" onclick="switchTab('records')">📋 明细</div>
    <div class="tab" onclick="switchTab('trash')">♻️ 回收站</div>
  </div>

  <!-- Tab: 总览 -->
  <div class="tab-content active" id="tab-dashboard">
    <!-- 录入表单 -->
    <div class="card" style="margin-bottom:20px;">
      <div class="section-title">
        ➕ 新增记录
        <div class="type-switch">
          <button class="active expense" id="typeBtnExpense" onclick="setRecordType('expense')">支出</button>
          <button class="income" id="typeBtnIncome" onclick="setRecordType('income')">收入</button>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-item"><label>日期</label><input type="date" id="fDate"></div>
        <div class="form-item"><label>金额</label><input type="number" id="fAmount" step="0.01" min="0" placeholder="0.00"></div>
        <div class="form-item"><label>一级分类</label><select id="fCat1" onchange="updateCat2Options()"></select></div>
        <div class="form-item"><label>二级分类</label><input type="text" id="fCat2" list="cat2List" placeholder="选择或输入"><datalist id="cat2List"></datalist></div>
        <div class="form-item"><label>支付方式</label><select id="fPay"><option>微信</option><option>支付宝</option><option>银行卡</option><option>信用卡</option><option>现金</option><option>其他</option></select></div>
        <div class="form-item"><label>备注</label><input type="text" id="fNote" placeholder="可选"></div>
        <div class="form-item"><label>&nbsp;</label><button class="btn btn-primary" onclick="addRecord()">✓ 记录</button></div>
      </div>
    </div>

    <!-- 图表 -->
    <div class="grid-2">
      <div class="card"><div class="section-title">📊 月度收支趋势</div><div class="chart-box"><canvas id="trendChart"></canvas></div></div>
      <div class="card"><div class="section-title">🥧 当月分类占比 <select id="pieMonth" onchange="renderPieChart()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;"></select></div><div class="chart-box"><canvas id="pieChart"></canvas></div></div>
    </div>
    <div class="card" style="margin-bottom:20px;"><div class="section-title">📈 各分类月度对比</div><div class="chart-box" style="height:300px;"><canvas id="stackChart"></canvas></div></div>
    <div class="card" style="margin-bottom:20px;"><div class="section-title">💡 智能分析</div><div id="insights"></div></div>
  </div>

  <!-- Tab: 预算 -->
  <div class="tab-content" id="tab-budget">
    <div class="card" style="margin-bottom:20px;">
      <div class="section-title">💰 设置预算 <span class="hint">阈值可随时调整，留空表示不设预算</span></div>
      <div class="budget-set-row">
        <select id="budgetMonth"></select>
        <select id="budgetCat"></select>
        <input type="number" id="budgetAmount" placeholder="预算金额" step="0.01" min="0" style="width:120px;">
        <button class="btn btn-primary btn-sm" onclick="setBudget()">设置</button>
      </div>
    </div>
    <div class="card"><div class="section-title" id="budgetTitle">本月预算执行</div><div id="budgetList"></div></div>
  </div>

  <!-- Tab: 日历 -->
  <div class="tab-content" id="tab-calendar">
    <div class="card">
      <div class="section-title">
        📅 日历视图
        <div class="cal-nav">
          <button onclick="calPrev()">‹ 上月</button>
          <span class="cal-month-label" id="calLabel"></span>
          <button onclick="calNext()">下月 ›</button>
        </div>
      </div>
      <div class="calendar" id="calendarGrid"></div>
    </div>
    <div class="card" style="margin-top:16px;" id="calDetailCard" style="display:none;">
      <div class="section-title" id="calDetailTitle">明细</div>
      <div id="calDetail"></div>
    </div>
  </div>

  <!-- Tab: 明细 -->
  <div class="tab-content" id="tab-records">
    <div class="card">
      <div class="section-title">📋 消费明细 <span class="hint" id="recordCount"></span></div>
      <div class="filter-row">
        <select id="filterMonth" onchange="renderTable()"></select>
        <select id="filterCat1" onchange="renderTable()"></select>
        <select id="filterType" onchange="renderTable()"><option value="">全部类型</option><option value="expense">支出</option><option value="income">收入</option></select>
        <input type="text" class="search" id="filterSearch" placeholder="搜索备注或分类..." oninput="renderTable()">
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>日期</th><th>类型</th><th>金额</th><th>一级分类</th><th>二级分类</th><th>支付方式</th><th>备注</th><th>操作</th></tr></thead><tbody id="recordTable"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Tab: 回收站 -->
  <div class="tab-content" id="tab-trash">
    <div class="card">
      <div class="section-title">♻️ 回收站 <span class="hint">删除的记录保留30天，可恢复</span></div>
      <div style="margin-bottom:14px;"><button class="btn btn-danger btn-sm" onclick="emptyTrash()">清空回收站</button></div>
      <div id="trashList"></div>
    </div>
  </div>
</div>


<!-- 云端同步模态框 -->
<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <div class="modal-title">☁️ 云端同步设置</div>
    <div id="syncConfig" style="margin-bottom:16px;">
      <p style="font-size:13px;color:var(--text-2);margin-bottom:12px;">数据通过 GitHub API 存储在你自己的仓库里，多设备自动同步。Token 只存在浏览器本地。</p>
      <div class="form-item" style="margin-bottom:10px;">
        <label>GitHub 用户名</label>
        <input type="text" id="syncUser" placeholder="如 auii-t" style="width:100%;">
      </div>
      <div class="form-item" style="margin-bottom:10px;">
        <label>仓库名</label>
        <input type="text" id="syncRepo" placeholder="如 ledger" style="width:100%;">
      </div>
      <div class="form-item" style="margin-bottom:10px;">
        <label>GitHub Token</label>
        <input type="password" id="syncToken" placeholder="ghp_xxxxx" style="width:100%;">
      </div>
      <div class="form-item" style="margin-bottom:10px;">
        <label>分支名（默认 main）</label>
        <input type="text" id="syncBranch" placeholder="main" style="width:100%;">
      </div>
      <button class="btn btn-primary" onclick="saveSyncConfig()" style="margin-top:8px;">保存配置</button>
    </div>
    <div id="syncStatus" style="margin:16px 0;padding:12px;background:#f5f6f7;border-radius:8px;font-size:13px;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button class="btn btn-success" onclick="syncPull()">⬇️ 从云端拉取</button>
      <button class="btn btn-primary" onclick="syncPush()">⬆️ 推送到云端</button>
      <button class="btn" onclick="toggleAutoSync()" id="autoSyncBtn">自动同步：开</button>
      <button class="btn btn-danger" onclick="clearSyncConfig()">清除配置</button>
      <button class="btn" onclick="closeSyncModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 导入模态框 -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <div class="modal-title">⬆️ 批量导入</div>
    <div style="margin-bottom:16px;">
      <p style="font-size:14px;color:var(--text-2);margin-bottom:10px;">支持 Excel (.xlsx) / CSV / JSON 格式。导入后会先列出识别结果供你确认。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <label class="btn btn-primary"><input type="file" accept=".xlsx,.csv,.json" onchange="handleImportFile(event)" style="display:none;">选择文件</label>
      </div>
    </div>
    <div id="importPreview"></div>
    <div class="modal-actions" id="importActions" style="display:none;">
      <button class="btn" onclick="closeImportModal()">取消</button>
      <button class="btn btn-success" onclick="confirmImport()">✓ 确认导入</button>
    </div>
  </div>
</div>

<script>

// ============ GitHub 云端同步层 ============
const SYNC_KEY = 'ledger_github_sync';
let syncConfig = loadSyncConfig();
let autoSync = localStorage.getItem('ledger_auto_sync') !== 'false';
let lastSyncTime = null;

function loadSyncConfig() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch(e) { return null; }
}
function saveSyncConfigLocal() { localStorage.setItem(SYNC_KEY, JSON.stringify(syncConfig)); }

function saveSyncConfig() {
  const user = document.getElementById('syncUser').value.trim();
  const repo = document.getElementById('syncRepo').value.trim();
  const token = document.getElementById('syncToken').value.trim();
  const branch = document.getElementById('syncBranch').value.trim() || 'main';
  if (!user || !repo || !token) { alert('请填写完整信息'); return; }
  syncConfig = { user, repo, token, branch };
  saveSyncConfigLocal();
  alert('配置已保存！现在可以同步数据了。');
  updateSyncStatus();
}

function clearSyncConfig() {
  if (!confirm('清除同步配置？本地数据不会删除。')) return;
  syncConfig = null;
  localStorage.removeItem(SYNC_KEY);
  updateSyncStatus();
}

function toggleAutoSync() {
  autoSync = !autoSync;
  localStorage.setItem('ledger_auto_sync', autoSync);
  document.getElementById('autoSyncBtn').textContent = '自动同步：' + (autoSync ? '开' : '关');
}

async function githubAPI(method, path, body) {
  const url = `https://api.github.com/repos/${syncConfig.user}/${syncConfig.repo}/contents/${path}`;
  const headers = {
    'Authorization': `token ${syncConfig.token}`,
    'Accept': 'application/vnd.github.v3+json'
  };
  const opts = { method, headers };
  if (body) {
    opts.body = JSON.stringify({
      message: 'ledger sync ' + new Date().toISOString(),
      content: btoa(unescape(encodeURIComponent(JSON.stringify(body)))),
      branch: syncConfig.branch
    });
  }
  const res = await fetch(url, opts);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub API ${res.status}: ${await res.text()}`);
  return res.json();
}

async function githubGetFile(path) {
  const url = `https://api.github.com/repos/${syncConfig.user}/${syncConfig.repo}/contents/${path}?ref=${syncConfig.branch}`;
  const res = await fetch(url, {
    headers: { 'Authorization': `token ${syncConfig.token}`, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub API ${res.status}`);
  const data = await res.json();
  return { sha: data.sha, content: JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))))) };
}

async function githubPutFile(path, content, sha) {
  const url = `https://api.github.com/repos/${syncConfig.user}/${syncConfig.repo}/contents/${path}`;
  const body = {
    message: 'ledger update ' + new Date().toISOString(),
    content: btoa(unescape(encodeURIComponent(JSON.stringify(content)))),
    branch: syncConfig.branch
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method: 'PUT',
    headers: { 'Authorization': `token ${syncConfig.token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`GitHub API ${res.status}: ${await res.text()}`);
  return res.json();
}

async function syncPush() {
  if (!syncConfig) { alert('请先配置同步信息'); return; }
  const btn = event?.target;
  if (btn) btn.textContent = '⬆️ 推送中...';
  try {
    const data = { records, categories, budgets, trash, exportDate: new Date().toISOString() };
    const existing = await githubGetFile('data.json');
    await githubPutFile('data.json', data, existing?.sha);
    lastSyncTime = new Date();
    localStorage.setItem('ledger_last_sync', lastSyncTime.toISOString());
    updateSyncStatus();
    if (btn) btn.textContent = '⬆️ 推送到云端';
    alert('✅ 已推送到云端！');
  } catch(e) {
    if (btn) btn.textContent = '⬆️ 推送到云端';
    alert('推送失败：' + e.message);
  }
}

async function syncPull() {
  if (!syncConfig) { alert('请先配置同步信息'); return; }
  const btn = event?.target;
  if (btn) btn.textContent = '⬇️ 拉取中...';
  try {
    const file = await githubGetFile('data.json');
    if (!file) {
      if (btn) btn.textContent = '⬇️ 从云端拉取';
      alert('云端暂无数据。请先「推送到云端」上传一次。');
      return;
    }
    const data = file.content;
    if (confirm(`从云端拉取 ${data.records?.length || 0} 条记录？这将覆盖本地数据。`)) {
      records = data.records || [];
      if (data.categories) categories = data.categories;
      if (data.budgets) budgets = data.budgets;
      if (data.trash) trash = data.trash;
      saveRecords(); saveCategories(); saveBudgets(); saveTrash();
      lastSyncTime = new Date();
      localStorage.setItem('ledger_last_sync', lastSyncTime.toISOString());
      renderAll();
      updateSyncStatus();
      alert('✅ 已从云端拉取最新数据！');
    }
    if (btn) btn.textContent = '⬇️ 从云端拉取';
  } catch(e) {
    if (btn) btn.textContent = '⬇️ 从云端拉取';
    alert('拉取失败：' + e.message);
  }
}

async function autoSyncPush() {
  if (!syncConfig || !autoSync) return;
  try {
    const data = { records, categories, budgets, trash, exportDate: new Date().toISOString() };
    const existing = await githubGetFile('data.json');
    await githubPutFile('data.json', data, existing?.sha);
    lastSyncTime = new Date();
    localStorage.setItem('ledger_last_sync', lastSyncTime.toISOString());
    updateSyncStatus();
  } catch(e) {
    console.warn('自动同步失败:', e.message);
  }
}

// 防抖自动同步
let syncTimer = null;
function debouncedSync() {
  if (!syncConfig || !autoSync) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(autoSyncPush, 3000);
}

function showSyncModal() {
  document.getElementById('syncModal').classList.add('show');
  if (syncConfig) {
    document.getElementById('syncUser').value = syncConfig.user || '';
    document.getElementById('syncRepo').value = syncConfig.repo || '';
    document.getElementById('syncToken').value = syncConfig.token || '';
    document.getElementById('syncBranch').value = syncConfig.branch || 'main';
  }
  document.getElementById('autoSyncBtn').textContent = '自动同步：' + (autoSync ? '开' : '关');
  updateSyncStatus();
}
function closeSyncModal() { document.getElementById('syncModal').classList.remove('show'); }

function updateSyncStatus() {
  const div = document.getElementById('syncStatus');
  const last = localStorage.getItem('ledger_last_sync');
  const lastStr = last ? new Date(last).toLocaleString('zh-CN') : '从未';
  if (syncConfig) {
    div.innerHTML = `✅ 已配置：${syncConfig.user}/${syncConfig.repo}（${syncConfig.branch}）<br>⏰ 最后同步：${lastStr}<br>🔄 自动同步：${autoSync ? '开启（每次修改后3秒自动推送）' : '关闭'}`;
  } else {
    div.innerHTML = '⚠️ 未配置同步信息，数据仅存在本地浏览器。';
  }
}

// 页面加载时自动拉取
async function initSync() {
  if (syncConfig && autoSync) {
    try {
      const file = await githubGetFile('data.json');
      if (file && file.content && file.content.records) {
        const cloudRecords = file.content.records;
        if (cloudRecords.length !== records.length) {
          if (confirm(`检测到云端有 ${cloudRecords.length} 条记录（本地 ${records.length} 条），是否拉取云端数据？`)) {
            records = cloudRecords;
            if (file.content.categories) categories = file.content.categories;
            if (file.content.budgets) budgets = file.content.budgets;
            if (file.content.trash) trash = file.content.trash;
            saveRecords(); saveCategories(); saveBudgets(); saveTrash();
            renderAll();
          }
        }
      }
      lastSyncTime = last ? new Date(last) : null;
    } catch(e) { console.warn('初始化同步失败:', e.message); }
  }
}

saveCategories = function() {
  _originalSaveCategories();
  debouncedSync();
};
const _originalSaveBudgets = saveBudgets;
saveBudgets = function() {
  _originalSaveBudgets();
  debouncedSync();
};
const _originalSaveTrash = saveTrash;
saveTrash = function() {
  _originalSaveTrash();
  debouncedSync();
};

  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) { try { return JSON.parse(saved); } catch(e) {} }

function saveRecords() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function loadBudgets() { try { return JSON.parse(localStorage.getItem(BUDGET_KEY)) || {}; } catch(e) { return {}; } }
function saveBudgets() { localStorage.setItem(BUDGET_KEY, JSON.stringify(budgets)); }
function loadTrash() { try { return JSON.parse(localStorage.getItem(TRASH_KEY)) || []; } catch(e) { return []; } }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function getMonth(d) { return d.slice(0,7); }
function formatMoney(n) { return '¥' + Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function getMonths() { return [...new Set(records.map(r=>getMonth(r.date)))].sort(); }

function colorForCat1(cat) {
  const colors = {'餐饮/食材':'#ff7d00','交通出行':'#4e83ff','居住/水电':'#00b42a','购物/休闲':'#a855f7','旅行':'#ec4899','工资收入':'#00b42a','退款收入':'#36cfc9','转账收入':'#597ef7','红包礼金':'#ff4d4f','其他收入':'#8c8c8c'};
  if (colors[cat]) return colors[cat];
  let hash=0; for(let i=0;i<cat.length;i++) hash=cat.charCodeAt(i)+((hash<<5)-hash);
  return `hsl(${Math.abs(hash)%360},65%,55%)`;
}

// ============ 示例数据 ============
function generateSampleData() {
  const data=[]; const today=new Date();
  const cats=DEFAULT_CATEGORIES.expense;
  for(let m=4;m>=0;m--){
    const dt=new Date(today.getFullYear(),today.getMonth()-m,1);
    const y=dt.getFullYear(),mo=dt.getMonth();
    const dim=new Date(y,mo+1,0).getDate();
    const upTo=(m===0)?today.getDate():dim;
    data.push({id:uid(),date:`${y}-${pad(mo+1)}-01`,amount:3500,type:'expense',cat1:'居住/水电',cat2:'房租',pay:'银行卡',note:'月租',created_at:new Date().toISOString()});
    data.push({id:uid(),date:`${y}-${pad(mo+1)}-02`,amount:80,type:'expense',cat1:'居住/水电',cat2:'网费',pay:'支付宝',note:'宽带',created_at:new Date().toISOString()});
    data.push({id:uid(),date:`${y}-${pad(mo+1)}-05`,amount:rand(120,280),type:'expense',cat1:'居住/水电',cat2:'水电煤',pay:'微信',note:'水电费',created_at:new Date().toISOString()});
    if(m<3) data.push({id:uid(),date:`${y}-${pad(mo+1)}-15`,amount:8000+m*200,type:'income',cat1:'工资收入',cat2:'月薪',pay:'银行卡',note:'工资',created_at:new Date().toISOString()});
    for(let d=1;d<=upTo;d++){
      if(Math.random()<0.9){const cnt=1+Math.floor(Math.random()*3);for(let k=0;k<cnt;k++){const subs=['买菜','外卖','外出就餐','水果','零食饮料'];const sub=subs[Math.floor(Math.random()*subs.length)];const amt=sub==='买菜'?rand(15,60):sub==='外卖'?rand(18,45):sub==='外出就餐'?rand(60,220):sub==='水果'?rand(12,50):rand(5,25);data.push({id:uid(),date:`${y}-${pad(mo+1)}-${pad(d)}`,amount:amt,type:'expense',cat1:'餐饮/食材',cat2:sub,pay:['微信','支付宝','银行卡','信用卡'][Math.floor(Math.random()*4)],note:sub,created_at:new Date().toISOString()});}}
      if(Math.random()<0.35){const subs=['地铁公交','打车','共享单车'];const sub=subs[Math.floor(Math.random()*subs.length)];const amt=sub==='地铁公交'?rand(3,12):sub==='打车'?rand(15,55):rand(1.5,3);data.push({id:uid(),date:`${y}-${pad(mo+1)}-${pad(d)}`,amount:amt,type:'expense',cat1:'交通出行',cat2:sub,pay:'微信',note:sub,created_at:new Date().toISOString()});}
    }
    const sc=3+Math.floor(Math.random()*6);
    for(let i=0;i<sc;i++){const subs=['服饰','护肤','电子产品','娱乐','订阅服务','旅行'];const sub=subs[Math.floor(Math.random()*subs.length)];const amt=sub==='电子产品'?rand(100,1500):sub==='旅行'?rand(200,800):sub==='服饰'?rand(80,500):sub==='护肤'?rand(60,300):sub==='娱乐'?rand(30,150):rand(15,50);const d=1+Math.floor(Math.random()*upTo);data.push({id:uid(),date:`${y}-${pad(mo+1)}-${pad(d)}`,amount:amt,type:'expense',cat1:sub==='旅行'?'旅行':'购物/休闲',cat2:sub,pay:['微信','支付宝','银行卡','信用卡'][Math.floor(Math.random()*4)],note:sub,created_at:new Date().toISOString()});}
  }
  return data;
}
function pad(n){return String(n).padStart(2,'0');}
function rand(min,max){return Math.round((Math.random()*(max-min)+min)*100)/100;}

// ============ 录入 ============
function setRecordType(t) {
  currentType = t;
  document.getElementById('typeBtnExpense').className = t==='expense'?'active expense':'expense';
  document.getElementById('typeBtnIncome').className = t==='income'?'active income':'income';
  renderCat1Selects();
  updateCat2Options();
}

function addRecord() {
  const date=document.getElementById('fDate').value;
  const amount=parseFloat(document.getElementById('fAmount').value);
  const cat1=document.getElementById('fCat1').value;
  const cat2=document.getElementById('fCat2').value.trim();
  const pay=document.getElementById('fPay').value;
  const note=document.getElementById('fNote').value.trim();
  if(!date){alert('请选择日期');return;}
  if(!amount||amount<=0){alert('请输入有效金额');return;}
  if(!cat1){alert('请选择一级分类');return;}
  if(!cat2){alert('请输入二级分类');return;}
  if(!categories[currentType][cat1]) categories[currentType][cat1]=[];
  if(!categories[currentType][cat1].includes(cat2)){categories[currentType][cat1].push(cat2);saveCategories();}
  records.push({id:uid(),date,amount:round(amount),type:currentType,cat1,cat2,pay,note,created_at:new Date().toISOString()});
  saveRecords();
  resetForm(); renderAll();
}

function deleteRecord(id) {
  const idx = records.findIndex(r=>r.id===id);
  if(idx<0) return;
  const r = records.splice(idx,1)[0];
  r.deleted_at = new Date().toISOString();
  r.auto_delete_after = new Date(Date.now()+30*86400000).toISOString();
  trash.push(r); saveRecords(); saveTrash(); renderAll();
}

function resetForm() {
  document.getElementById('fAmount').value='';
  document.getElementById('fCat2').value='';
  document.getElementById('fNote').value='';
  document.getElementById('fDate').value=new Date().toISOString().slice(0,10);
}
function round(n){return Math.round(n*100)/100;}

// ============ 回收站 ============
function restoreRecord(id) {
  const idx = trash.findIndex(r=>r.id===id);
  if(idx<0) return;
  const r = trash.splice(idx,1)[0];
  delete r.deleted_at; delete r.auto_delete_after;
  records.push(r); saveRecords(); saveTrash(); renderAll();
}
function permanentDelete(id) {
  if(!confirm('永久删除不可恢复，确认？')) return;
  trash = trash.filter(r=>r.id!==id); saveTrash(); renderAll();
}
function emptyTrash() {
  if(trash.length===0) return;
  if(!confirm(`清空回收站中 ${trash.length} 条记录？不可恢复！`)) return;
  trash=[]; saveTrash(); renderAll();
}

// ============ 分类下拉 ============
function renderCat1Selects() {
  const sel=document.getElementById('fCat1');
  sel.innerHTML='';
  const cats=categories[currentType]||{};
  Object.keys(cats).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
  const o=document.createElement('option');o.value='__new__';o.textContent='＋ 新建...';sel.appendChild(o);
  sel.onchange=function(){if(this.value==='__new__'){const n=prompt('输入新的一级分类名称：');if(n&&n.trim()&&!categories[currentType][n.trim()]){categories[currentType][n.trim()]=[];saveCategories();renderCat1Selects();this.value=n.trim();}else{this.value=Object.keys(cats)[0];}}updateCat2Options();};

  const fc=document.getElementById('filterCat1');
  const prev=fc.value; fc.innerHTML='<option value="">全部分类</option>';

  Object.keys(allCats).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;fc.appendChild(o);});

function updateCat2Options() {
  const cat1=document.getElementById('fCat1').value;
  const list=document.getElementById('cat2List');
  list.innerHTML='';
  if(categories[currentType]&&categories[currentType][cat1]){categories[currentType][cat1].forEach(s=>{const o=document.createElement('option');o.value=s;list.appendChild(o);});}
}

// ============ KPI ============
function renderKPI() {
  const months=getMonths(); const div=document.getElementById('kpiRow');
  if(months.length===0){div.innerHTML='<div class="card kpi" style="grid-column:span 5;"><div class="empty">暂无数据</div></div>';return;}
  const cur=months[months.length-1];
  const prev=months.length>1?months[months.length-2]:null;
  const curExp=sumByMonth(cur,'expense'),curInc=sumByMonth(cur,'income');
  const curBal=curInc-curExp;
  const prevExp=prev?sumByMonth(prev,'expense'):0;
  const change=prevExp>0?((curExp-prevExp)/prevExp*100):0;
  const curRecs=records.filter(r=>getMonth(r.date)===cur);
  const avg=curExp/new Date(parseInt(cur.slice(0,4)),parseInt(cur.slice(5,7)),0).getDate();
  let chHtml='';
  if(prev){const cls=change>0?'up':'down';const arr=change>0?'↑':'↓';chHtml=`<div class="kpi-sub ${cls}">较上月 ${arr} ${Math.abs(change).toFixed(1)}%</div>`;}
  div.innerHTML=`
    <div class="card kpi"><div class="kpi-label">本月支出（${cur}）</div><div class="kpi-value expense">${formatMoney(curExp)}</div>${chHtml}</div>
    <div class="card kpi"><div class="kpi-label">本月收入</div><div class="kpi-value income">${formatMoney(curInc)}</div><div class="kpi-sub">${curRecs.filter(r=>r.type==='income').length} 笔收入</div></div>
    <div class="card kpi"><div class="kpi-label">本月结余</div><div class="kpi-value balance">${formatMoney(curBal)}</div><div class="kpi-sub">${curBal>=0?'有结余':'入不敷出'}</div></div>
    <div class="card kpi"><div class="kpi-label">日均支出</div><div class="kpi-value primary">${formatMoney(avg)}</div><div class="kpi-sub">${curRecs.length} 笔记录</div></div>
    <div class="card kpi"><div class="kpi-label">回收站</div><div class="kpi-value">${trash.length} 条</div><div class="kpi-sub">${trash.length>0?'可恢复':'空'}</div></div>`;
}
function sumByMonth(m,type){return records.filter(r=>getMonth(r.date)===m&&r.type===type).reduce((s,r)=>s+r.amount,0);}

// ============ 图表 ============
let trendChart,pieChart,stackChart;
function renderTrendChart(){
  const months=getMonths();const ctx=document.getElementById('trendChart').getContext('2d');
  if(trendChart)trendChart.destroy();
  trendChart=new Chart(ctx,{type:'line',data:{labels:months,datasets:[
    {label:'支出',data:months.map(m=>sumByMonth(m,'expense')),borderColor:'#f53f3f',backgroundColor:'rgba(245,63,63,0.08)',fill:true,tension:0.3,pointRadius:4,pointBackgroundColor:'#f53f3f'},
    {label:'收入',data:months.map(m=>sumByMonth(m,'income')),borderColor:'#00b42a',backgroundColor:'rgba(0,180,42,0.08)',fill:true,tension:0.3,pointRadius:4,pointBackgroundColor:'#00b42a'}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top'},tooltip:{callbacks:{label:(c)=>c.dataset.label+': '+formatMoney(c.parsed.y)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'¥'+v}}}}});
}
function renderPieChart(){
  const m=document.getElementById('pieMonth').value;const ctx=document.getElementById('pieChart').getContext('2d');
  if(pieChart)pieChart.destroy();
  const recs=records.filter(r=>getMonth(r.date)===m&&r.type==='expense');
  const cs={};recs.forEach(r=>{cs[r.cat1]=(cs[r.cat1]||0)+r.amount;});
  const labels=Object.keys(cs),vals=labels.map(l=>cs[l]);
  pieChart=new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data:vals,backgroundColor:labels.map(l=>colorForCat1(l)),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'},tooltip:{callbacks:{label:(c)=>{const t=vals.reduce((a,b)=>a+b,0);return c.label+': '+formatMoney(c.parsed)+' ('+(c.parsed/t*100).toFixed(1)+'%)';}}}}}});
}
function renderStackChart(){
  const months=getMonths();const ctx=document.getElementById('stackChart').getContext('2d');
  if(stackChart)stackChart.destroy();
  const cats=[...new Set(records.filter(r=>r.type==='expense').map(r=>r.cat1))];
  const ds=cats.map(c=>({label:c,data:months.map(m=>records.filter(r=>getMonth(r.date)===m&&r.cat1===c&&r.type==='expense').reduce((s,r)=>s+r.amount,0)),backgroundColor:colorForCat1(c),borderRadius:4}));
  stackChart=new Chart(ctx,{type:'bar',data:{labels:months,datasets:ds},options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{callback:v=>'¥'+v}}},plugins:{legend:{position:'top'},tooltip:{callbacks:{label:(c)=>c.dataset.label+': '+formatMoney(c.parsed.y)}}}}});
}
function updateMonthSelectors(){
  const months=getMonths();
  const pm=document.getElementById('pieMonth'),fm=document.getElementById('filterMonth'),bm=document.getElementById('budgetMonth');
  pm.innerHTML='';fm.innerHTML='<option value="">全部月份</option>';if(bm)bm.innerHTML='';
  months.slice().reverse().forEach(m=>{const o1=document.createElement('option');o1.value=m;o1.textContent=m;pm.appendChild(o1);const o2=document.createElement('option');o2.value=m;o2.textContent=m;fm.appendChild(o2);if(bm){const o3=document.createElement('option');o3.value=m;o3.textContent=m;bm.appendChild(o3);}});

// ============ 明细表 ============
function renderTable(){
  const m=document.getElementById('filterMonth').value,c=document.getElementById('filterCat1').value,t=document.getElementById('filterType').value,s=document.getElementById('filterSearch').value.toLowerCase();
  let f=records.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(m)f=f.filter(r=>getMonth(r.date)===m);
  if(c)f=f.filter(r=>r.cat1===c);
  if(t)f=f.filter(r=>r.type===t);
  if(s)f=f.filter(r=>(r.note||'').toLowerCase().includes(s)||r.cat1.toLowerCase().includes(s)||r.cat2.toLowerCase().includes(s));
  document.getElementById('recordCount').textContent=`共 ${f.length} 条`;
  const tb=document.getElementById('recordTable');
  if(f.length===0){tb.innerHTML='<tr><td colspan="8" class="empty">没有符合条件的记录</td></tr>';return;}
  tb.innerHTML=f.map(r=>{const col=colorForCat1(r.cat1);const typeTag=r.type==='income'?'<span class="tag" style="background:#e8ffea;color:#00b42a;">收入</span>':'<span class="tag" style="background:#fff1f0;color:#f53f3f;">支出</span>';const amt=r.type==='income'?'+':'-';return `<tr><td>${r.date}</td><td>${typeTag}</td><td class="amount ${r.type}">${amt}${formatMoney(r.amount)}</td><td><span class="tag" style="background:${col}20;color:${col};">${r.cat1}</span></td><td>${r.cat2}</td><td>${r.pay||'—'}</td><td>${r.note||'<span style="color:#bbb">—</span>'}</td><td class="row-actions"><button class="btn btn-sm btn-danger" onclick="deleteRecord('${r.id}')">删除</button></td></tr>`;}).join('');
}

// ============ 预算 ============
function setBudget(){
  const m=document.getElementById('budgetMonth').value,c=document.getElementById('budgetCat').value,a=parseFloat(document.getElementById('budgetAmount').value);
  if(!m||!c){alert('请选择月份和分类');return;}
  if(!a||a<=0){alert('请输入有效金额');return;}
  if(!budgets[m])budgets[m]={};
  budgets[m][c]=round(a);saveBudgets();renderBudget();
  document.getElementById('budgetAmount').value='';
}
function renderBudget(){
  const m=document.getElementById('budgetMonth')?.value;
  if(!m)return;
  const div=document.getElementById('budgetList');
  const mb=budgets[m]||{};
  const keys=Object.keys(mb);
  document.getElementById('budgetTitle').textContent=`${m} 预算执行`;
  if(keys.length===0){div.innerHTML='<div class="empty">本月暂未设置预算。在上方设置后，这里会显示执行进度。</div>';return;}
  const actual={};
  records.filter(r=>r.type==='expense'&&getMonth(r.date)===m).forEach(r=>{actual[r.cat1]=(actual[r.cat1]||0)+r.amount;});
  div.innerHTML=keys.map(c=>{
    const budget=mb[c],spent=actual[c]||0,pct=budget>0?(spent/budget*100):0,rem=budget-spent;
    const level=pct>=100?'over':pct>=80?'warning':'normal';
    const levelText=level==='over'?'已超支':level==='warning'?'接近预算':'正常';
    return `<div class="budget-item">
      <div class="budget-header"><span class="budget-cat">${c}</span><span class="budget-amount">预算 ${formatMoney(budget)} · 已花 ${formatMoney(spent)}</span></div>
      <div class="budget-bar"><div class="budget-fill ${level}" style="width:${Math.min(pct,100)}%"></div></div>
      <div class="budget-detail"><span>${levelText} · ${pct.toFixed(1)}%</span><span>${rem>=0?'剩余 '+formatMoney(rem):'超支 '+formatMoney(-rem)}</span></div>
    </div>`;
  }).join('');
}

// ============ 日历 ============
function renderCalendar(){
  const grid=document.getElementById('calendarGrid');
  const label=document.getElementById('calLabel');
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const today=new Date();
  label.textContent=`${calYear}年${calMonth+1}月`;
  // 收集每日数据
  const monthStr=`${calYear}-${pad(calMonth+1)}`;
  const daily={};
  records.filter(r=>getMonth(r.date)===monthStr).forEach(r=>{
    const d=parseInt(r.date.slice(8,10));
    if(!daily[d])daily[d]={expense:0,income:0,count:0};
    if(r.type==='expense')daily[d].expense+=r.amount;else daily[d].income+=r.amount;
    daily[d].count++;
  });
  let html='';
  ['日','一','二','三','四','五','六'].forEach(d=>{html+=`<div class="cal-header">${d}</div>`;});
  for(let i=0;i<firstDay;i++)html+='<div class="cal-day empty"></div>';
  for(let d=1;d<=dim;d++){
    const dd=daily[d];
    let cls='';let amtText='';
    if(dd){
      if(dd.expense>0&&dd.income>0)cls='has-both';
      else if(dd.expense>0)cls='has-expense';
      else if(dd.income>0)cls='has-income';
      amtText=dd.expense>0?`<div class="day-amt">-${formatMoney(dd.expense)}</div>`:`<div class="day-amt" style="color:#00b42a">+${formatMoney(dd.income)}</div>`;
    }
    const isToday=(calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate())?'today':'';
    html+=`<div class="cal-day ${cls} ${isToday}" onclick="showDayDetail(${d})"><div class="day-num">${d}</div>${amtText}</div>`;
  }
  grid.innerHTML=html;
}
function showDayDetail(d){
  const monthStr=`${calYear}-${pad(calMonth+1)}`;
  const dateStr=`${monthStr}-${pad(d)}`;
  const dayRecs=records.filter(r=>r.date===dateStr).sort((a,b)=>b.amount-a.amount);
  const card=document.getElementById('calDetailCard');
  const title=document.getElementById('calDetailTitle');
  const detail=document.getElementById('calDetail');
  card.style.display='block';
  title.textContent=`${dateStr} 明细（${dayRecs.length} 笔）`;
  if(dayRecs.length===0){detail.innerHTML='<div class="empty">当天无记录</div>';return;}
  const exp=dayRecs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
  const inc=dayRecs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  detail.innerHTML=`<div style="margin-bottom:12px;font-size:13px;"><span style="color:#f53f3f;">支出 ${formatMoney(exp)}</span> · <span style="color:#00b42a;">收入 ${formatMoney(inc)}</span></div>`+dayRecs.map(r=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f2f3f5;font-size:13px;"><span>${r.cat1}/${r.cat2} ${r.note?'· '+r.note:''}</span><span class="amount ${r.type}">${r.type==='income'?'+':'-'}${formatMoney(r.amount)}</span></div>`).join('');
}
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}

// ============ 回收站列表 ============
function renderTrash(){
  const div=document.getElementById('trashList');
  if(trash.length===0){div.innerHTML='<div class="empty">回收站为空</div>';return;}
  trash.sort((a,b)=>(b.deleted_at||'').localeCompare(a.deleted_at||''));
  div.innerHTML=trash.map(r=>{
    const expire=r.auto_delete_after?new Date(r.auto_delete_after).toLocaleDateString():'';
    return `<div class="trash-item"><div class="info"><span>${r.date} · ${r.type==='income'?'收入':'支出'} ${formatMoney(r.amount)} · ${r.cat1}/${r.cat2} ${r.note?'· '+r.note:''}</span><div class="expire">删除于 ${new Date(r.deleted_at).toLocaleDateString()} · ${expire}后自动清除</div></div><div class="row-actions"><button class="btn btn-sm btn-success" onclick="restoreRecord('${r.id}')">恢复</button><button class="btn btn-sm btn-danger" onclick="permanentDelete('${r.id}')">永久删除</button></div></div>`;
  }).join('');
}

// ============ 智能分析 ============
function renderInsights(){
  const months=getMonths();const div=document.getElementById('insights');
  if(months.length===0){div.innerHTML='<div class="empty">暂无数据</div>';return;}
  const cur=months[months.length-1];const curExp=sumByMonth(cur,'expense'),curInc=sumByMonth(cur,'income');
  const curBal=curInc-curExp;const insights=[];
  // 收支平衡
  if(curInc>0){
    if(curBal<0){insights.push({type:'danger',icon:'⚠️',title:'本月入不敷出',desc:`支出 ${formatMoney(curExp)} > 收入 ${formatMoney(curInc)}，结余 ${formatMoney(curBal)}，建议控制支出。`});}
    else{insights.push({type:'success',icon:'✅',title:'本月有结余',desc:`收入 ${formatMoney(curInc)} - 支出 ${formatMoney(curExp)} = 结余 ${formatMoney(curBal)}。`});}
  }
  // 环比
  if(months.length>=2){
    const prev=months[months.length-2];const prevExp=sumByMonth(prev,'expense');
    const change=(curExp-prevExp)/prevExp*100;
    if(change>15){insights.push({type:'danger',icon:'📈',title:`支出环比上升 ${change.toFixed(1)}%`,desc:`${formatMoney(curExp)} vs 上月 ${formatMoney(prevExp)}，增长明显。`});}
    else if(change<-10){insights.push({type:'success',icon:'📉',title:`支出环比下降 ${Math.abs(change).toFixed(1)}%`,desc:`${formatMoney(curExp)} vs 上月 ${formatMoney(prevExp)}，控制得不错。`});}
  }
  // 占比
  const curRecs=records.filter(r=>getMonth(r.date)===cur&&r.type==='expense');
  const cs={};curRecs.forEach(r=>{cs[r.cat1]=(cs[r.cat1]||0)+r.amount;});
  const sc=Object.entries(cs).sort((a,b)=>b[1]-a[1]);
  if(sc.length>0){const [tc,ta]=sc[0];const pct=(ta/curExp*100).toFixed(1);if(pct>45){insights.push({type:'warn',icon:'🎯',title:`「${tc}」占比 ${pct}%`,desc:`${formatMoney(ta)}，超过总支出的 ${pct}%。`});}}
  div.innerHTML=insights.length>0?insights.map(i=>`<div class="insight-item ${i.type}"><span class="icon">${i.icon}</span><div><div class="title">${i.title}</div><div class="desc">${i.desc}</div></div></div>`).join(''):'<div class="insight-item success"><span class="icon">✨</span><div><div class="title">一切正常</div><div class="desc">暂未发现异常。</div></div></div>';
}

// ============ 批量导入 ============
function showImportModal(){document.getElementById('importModal').classList.add('show');document.getElementById('importPreview').innerHTML='';document.getElementById('importActions').style.display='none';pendingImport=[];}
function closeImportModal(){document.getElementById('importModal').classList.remove('show');}
function handleImportFile(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  const isJSON=file.name.endsWith('.json');
  if(isJSON){
    reader.onload=e=>{
      try{const data=JSON.parse(e.target.result);
        if(data.records&&Array.isArray(data.records)){
          pendingImport=data.records.map(r=>({date:r.date,amount:r.amount,cat1:r.cat1,cat2:r.cat2,pay:r.pay||'',note:r.note||'',type:r.type||'expense',source:'json'}));
          renderImportPreview();
        }else{alert('JSON 格式不正确');}
      }catch(err){alert('解析失败：'+err.message);}
    };
    reader.readAsText(file);
  }else{
    // Excel/CSV - 读取为 base64 发到后端处理（简化版：提示用户用云端处理）
    reader.onload=e=>{
      // 尝试用简单 CSV 解析
      const text=e.target.result;
      const lines=text.split('\n').filter(l=>l.trim());
      if(lines.length<2){alert('文件内容为空或格式不支持');return;}
      const header=lines[0].split(/[,，\t]/);
      pendingImport=parseCSVLines(lines,header);
      renderImportPreview();
    };
    reader.readAsText(file);
  }
  event.target.value='';
}
function parseCSVLines(lines,header){
  // 识别列
  const map={};
  header.forEach((h,i)=>{h=h.trim().toLowerCase();if(h.includes('日期')||h.includes('date'))map.date=i;if(h.includes('金额')||h.includes('amount'))map.amount=i;if(h.includes('分类')||h.includes('category'))map.cat=i;if(h.includes('备注')||h.includes('note')||h.includes('商品')||h.includes('说明'))map.note=i;if(h.includes('类型')||h.includes('type'))map.type=i;if(h.includes('支付')||h.includes('pay'))map.pay=i;});
  const result=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(/[,，\t]/);
    if(!map.amount||!cols[map.amount])continue;
    let amount=parseFloat(cols[map.amount]);if(!amount||amount===0)continue;
    let type='expense';if(amount<0)amount=Math.abs(amount);
    if(map.type&&cols[map.type]&&cols[map.type].includes('收入'))type='income';
    const note=map.note?cols[map.note]||'导入记录':'导入记录';
    const date=map.date?(cols[map.date]||new Date().toISOString().slice(0,10)):new Date().toISOString().slice(0,10);
    // 简单分类推断
    let cat1='购物/休闲',cat2='其他';
    const kw={外卖:['外卖','美团'],打车:['打车','滴滴'],买菜:['买菜','超市','盒马'],咖啡:['咖啡','瑞幸']};
    for(const [c,kws] of Object.entries(kw)){if(kws.some(k=>note.includes(k))){cat1='餐饮/食材';cat2=c;break;}}
    result.push({date:normalizeDate(date),amount:round(amount),cat1,cat2,pay:map.pay?cols[map.pay]||'':'',note,type,source:'csv'});
  }
  return result;
}
function normalizeDate(s){s=String(s).trim();const m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);if(m)return `${m[1]}-${pad(parseInt(m[2]))}-${pad(parseInt(m[3]))}`;return s;}
function renderImportPreview(){
  if(pendingImport.length===0){document.getElementById('importPreview').innerHTML='<div class="empty">未识别到有效记录</div>';return;}
  const div=document.getElementById('importPreview');
  div.innerHTML=`<p style="margin-bottom:10px;font-size:13px;color:var(--text-2);">识别到 ${pendingImport.length} 条记录，请检查后确认导入：</p>
    <div style="max-height:400px;overflow-y:auto;"><table class="import-table"><thead><tr><th>日期</th><th>类型</th><th>金额</th><th>一级分类</th><th>二级分类</th><th>备注</th></tr></thead><tbody>
    ${pendingImport.map((r,i)=>`<tr><td>${r.date}</td><td><select onchange="pendingImport[${i}].type=this.value"><option value="expense" ${r.type==='expense'?'selected':''}>支出</option><option value="income" ${r.type==='income'?'selected':''}>收入</option></select></td><td>${formatMoney(r.amount)}</td><td><input value="${r.cat1}" onchange="pendingImport[${i}].cat1=this.value" style="width:100px;"></td><td><input value="${r.cat2}" onchange="pendingImport[${i}].cat2=this.value" style="width:80px;"></td><td><input value="${r.note}" onchange="pendingImport[${i}].note=this.value" style="width:150px;"></td></tr>`).join('')}
    </tbody></table></div>`;
  document.getElementById('importActions').style.display='flex';
}
function confirmImport(){
  if(pendingImport.length===0)return;
  const batchId=uid();
  pendingImport.forEach(r=>{
    records.push({id:uid(),date:r.date,amount:r.amount,type:r.type,cat1:r.cat1,cat2:r.cat2,pay:r.pay,note:r.note,source:r.source,import_batch:batchId,created_at:new Date().toISOString()});
    // 自动添加新分类
    if(!categories[r.type])categories[r.type]={};
    if(!categories[r.type][r.cat1])categories[r.type][r.cat1]=[];
    if(!categories[r.type][r.cat1].includes(r.cat2)){categories[r.type][r.cat1].push(r.cat2);}
  });
  saveRecords();saveCategories();renderAll();
  closeImportModal();
  alert(`已导入 ${pendingImport.length} 条记录。如需撤销，在明细表中删除该批记录即可。`);
  pendingImport=[];
}

// ============ 导入导出 ============
function exportJSON(){
  const data={records,categories,budgets,trash,exportDate:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`记账数据_${new Date().toISOString().slice(0,10)}.json`;a.click();
  URL.revokeObjectURL(url);
}
function importJSON(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{const data=JSON.parse(e.target.result);
      if(data.records&&Array.isArray(data.records)){
        if(confirm(`导入 ${data.records.length} 条记录，覆盖当前数据？`)){
          records=data.records;if(data.categories)categories=data.categories;if(data.budgets)budgets=data.budgets;if(data.trash)trash=data.trash;
          saveRecords();saveCategories();saveBudgets();saveTrash();renderAll();alert('导入成功！');
        }
      }else{alert('格式不正确');}
    }catch(err){alert('解析失败：'+err.message);}
  };
  reader.readAsText(file);event.target.value='';
}
function clearAllData(){
  if(!confirm('清空所有记录？建议先导出备份。'))return;
  if(!confirm('再次确认：真的删除全部数据？'))return;
  records=[];trash=[];saveRecords();saveTrash();renderAll();
}

// ============ Tab 切换 ============
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='budget')renderBudget();
  if(name==='calendar')renderCalendar();
  if(name==='trash')renderTrash();
}

// ============ 主渲染 ============
function renderAll(){
  renderCat1Selects();updateCat2Options();updateMonthSelectors();
  renderKPI();renderTrendChart();renderPieChart();renderStackChart();
  renderTable();renderInsights();
}

calYear=now.getFullYear();calMonth=now.getMonth();
document.getElementById('fDate').value=now.toISOString().slice(0,10);
renderAll();
initSync();
